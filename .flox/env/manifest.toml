schema-version = "1.13.0"

[install]
claude-code.pkg-path = "flox/claude-code"
claude-code.pkg-group = "claude-code"
flox-ai.pkg-path = "flox/flox-ai"
# nixpkgs package in toplevel: flox publish pins the base catalog page
# from the toplevel group, and flox-ai alone (custom catalog) can't
coreutils.pkg-path = "coreutils"

# flox-ai audit toolchain (custom FloxHub catalog), used by the CI audit
# step and locally to score skill quality. Toplevel to mirror
# flox-internal-skills; if this poisons `flox build`/`flox publish`
# resolution of the base catalog page, move these five to a dedicated
# pkg-group (same fallback flox-internal-skills documents).
skill-tools.pkg-path = "flox/skill-tools"
skill-validator.pkg-path = "flox/skill-validator"
claudelint.pkg-path = "flox/claudelint"
skillcheck.pkg-path = "flox/skillcheck"
skillspector.pkg-path = "flox/skillspector"
# skillspector ships its own bin/python; priority 6 (> default 5) so the
# eval suite's python311 keeps owning bin/python in the merged env.
skillspector.priority = 6

# The eval suite's interpreter. Activate this environment and run the
# harnesses as plain `python3 evals/<...>` — that is the supported invocation
# everywhere (README examples, and every CI job via a step-level
# `shell: flox activate -- bash ... {0}`), so a clean checkout needs flox and
# no ambient Python, and local runs use the same interpreter CI does. The
# activation is the environment's job; no script or doc example carries it as
# a prefix. 3.11 is the floor the harnesses actually require —
# they parse manifests with stdlib `tomllib` — and it is what the workflow
# used to request from actions/setup-python, so the pin changes nothing about
# what the tests run under, only where it comes from.
#
# Own pkg-group, deliberately: `flox publish` pins the skills-flox base
# catalog page from the TOPLEVEL group, and adding a fourth constraint there
# would let the eval runtime move that page. Nothing here shares a closure
# with python311, so an isolated group costs nothing.
python311.pkg-path = "python311"
python311.pkg-group = "python"

[vars]
# Suppress npm update-notifier banners. claudelint prints an
# "Update available" line to stdout before its JSON, which flox-ai's
# audit engine (whole-buffer JSON parse) then rejects, zeroing the
# quality dimension. This makes claudelint's output pure JSON.
NO_UPDATE_NOTIFIER = "1"

# Packages the flox plugin (skills: flox, floxify, flox-debug) for all agents.
# Stages the plugin under share/claude-code/plugins/flox, then
# flox_agent_layout rewrites it into the per-agent launch layout
# share/flox/{claude,codex,pi,opencode}/flox and drops the staging,
# matching the floxenvs skills-* packages.
[build.skills-flox]
version = "1.1.0"
description = "Flox skills (flox, floxify, flox-debug) packaged for Claude Code, Codex, Pi, and OpenCode"
# content-only package: keep toplevel installs (flox-ai) out of the closure
runtime-packages = []
command = '''
  mkdir -p "$out/share/claude-code/plugins/flox"
  cp -R flox-plugin/. "$out/share/claude-code/plugins/flox/"
  source .flox/nix/flox-agent-layout.sh
  flox_agent_layout "flox" "$out/share"
'''
