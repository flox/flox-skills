name: skill-evals

# Gates changes to the Flox skill / eval suite on the eval harness:
# run.py --gate exits non-zero only if a functional `should`-tier task fails its
# deterministic hard-checks. Judge score and implicit-triggering rate are
# probabilistic, so they're reported but never block. Agent + judge run via
# `claude`, authenticated with the org-managed Anthropic key.
#
# EVERY job here gets its Python (and, where it needs one, its `claude`) from
# this repo's own Flox environment (AI-509 Ticket 1). There is no
# actions/setup-python and no `npm install -g` anywhere in this workflow: the
# interpreter is `python311` in .flox/env/manifest.toml, pinned by
# manifest.lock on all four systems, so a clean checkout needs flox and
# nothing else.
#
# The activation is a STEP-LEVEL property, not a per-command prefix. Each step
# that needs the environment carries
#
#   shell: flox activate -- bash --noprofile --norc -e -o pipefail {0}
#
# so GitHub hands its generated script to bash as `{0}` and the WHOLE script
# runs inside one activation. Commands inside are plain `python3 ...`, exactly
# what a developer types after their own `flox activate`. Adding a job? Give
# its steps that shell key rather than wrapping each command.
#
# The job runs on every pull request so the required `evals` status check always
# reports. The heavy suite runs only when the skill or eval sources change
# (flox-plugin/**, evals/**, or this workflow); other PRs short-circuit to a
# passing check so a path-filtered gate never wedges docs/config PRs.
#
# workflow_dispatch can pick an arm (skills / baseline) and toggle the gate —
# e.g. to measure the bare-model baseline without failing the run.
#
# The floxify jobs (floxify-evals = synthetic fixtures, floxify-real-world =
# pinned real repositories) are SEPARATE from the per-PR skills gate. The /floxify evals are outcome-based:
# they run the skill against fixture/real repos and need a live flox + catalog
# + network, so they are too slow and too environment-dependent to gate every
# PR. They run weekly, on manual dispatch (run_floxify=true), and — via the
# `changes` job below — on pull requests that actually touch the floxify eval
# sources or the skill (evals/floxify/** or flox-plugin/skills/**). They never
# run on unrelated PRs, and they never gate: the synthetic tier reports its own
# hard-check gate only on schedule/dispatch, and the real-world tier is
# report-only in all modes.
#
# golden-lint is DIFFERENT from those two: it spawns no `claude` (zero
# Anthropic API spend, only `flox show` calls), so it does NOT need the
# dispatch-only cost gate — it runs per-PR via the same `changes` filter,
# giving the golden-manifest lint (AI-456 item 2) real teeth against every
# PR that touches floxify sources, not just on manual dispatch.
on:
  pull_request:
  # Weekly cron retired: every paid job below is now dispatch-only, so a
  # scheduled run would spin up a workflow in which nothing executes. Restore
  # it together with the paid jobs.
  workflow_dispatch:
    inputs:
      mode:
        description: "Eval arm to run (skills job)"
        type: choice
        options:
          - skills
          - baseline
        default: skills
      gate:
        description: "Fail the run on should-tier hard-check failures"
        type: boolean
        default: true
      run_floxify:
        description: "Also run the /floxify outcome eval (needs live flox)"
        type: boolean
        default: false
      run_paid_evals:
        description: "Run the PAID skills eval suite (62 Opus calls: 31 tasks x agent+judge, ~$5-15). Off by default."
        type: boolean
        default: false

concurrency:
  group: skill-evals-${{ github.ref }}-${{ github.event.inputs.mode || 'skills' }}
  cancel-in-progress: true

jobs:
  changes:
    # Path filter that decides whether a PR touches the floxify eval sources or
    # the skill. Runs on ALL events (no job-level `if`) so it never propagates a
    # skip to the floxify jobs that `needs:` it — on schedule/dispatch the
    # filter step is skipped and the output is empty, which is fine because
    # those event branches of the floxify `if` don't consult it. This job does
    # NOT gate the fast `evals` (skills) job, which keeps running on every PR.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      floxify: ${{ steps.filter.outputs.floxify }}
      skill_toml: ${{ steps.filter.outputs.skill_toml }}
    steps:
      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            floxify:
              - 'evals/floxify/**'
              - 'flox-plugin/skills/**'
            skill_toml:
              - 'flox-plugin/skills/flox/**'
              - 'evals/flox/skill_toml_lint.py'
              - 'evals/flox/tests/test_skill_toml_lint.py'
              - '.github/workflows/evals.yml'

  evals:
    # REQUIRED status check on main. This job must keep REPORTING on every PR,
    # or branch protection blocks every merge waiting for a context that never
    # arrives — so it is not disabled, it is DEFUNDED. The paid suite is behind
    # an explicit workflow_dispatch opt-in (run_paid_evals); what runs by
    # default is the free deterministic unit-test suite, which keeps the
    # required check honest instead of a rubber stamp.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Decide whether to spend on the paid eval suite
        id: changes
        run: |
          # PAID EVALS ARE OFF IN CI. The skills suite is 27 tasks x (1 agent +
          # 1 judge) = 54 Opus calls per run, and the path filter it used to
          # rely on matches 'evals/' and 'flox-plugin/' — i.e. essentially every
          # PR in this workstream. It is off for two independent reasons:
          #
          #   1. Cost. Measured floor is ~$0.088 for a *4-token* Opus reply
          #      (~23k tokens of context are created/read regardless), so 54
          #      calls cost several dollars minimum, per PR, per push.
          #   2. Trust. The suite is under active repair and is currently wrong
          #      in both directions: the real-world judge fabricated a catalog
          #      defect in 4 of 8 runs (always against a CORRECT manifest), and
          #      3 of 8 golden references carry false claims. Paying Opus rates
          #      for a signal we know is unreliable buys nothing.
          #
          # Re-enable per-run via: Actions > Run workflow > run_paid_evals=true.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && \
             [ "${{ github.event.inputs.run_paid_evals }}" = "true" ]; then
            echo "Explicitly dispatched with run_paid_evals=true — running the paid suite."
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Paid evals are disabled in CI; running the free unit tests instead."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      # The eval interpreter comes from THIS REPO'S Flox environment
      # (.flox/env/manifest.toml pins python311), not from a runner-provided
      # one — AI-509 Ticket 1. The steps below activate that environment once
      # via their `shell:` key and then run plain `python3 ...`, the same
      # commands a developer runs after `flox activate`, so "works on my
      # machine" and "works in CI" mean the same interpreter. This replaces
      # actions/setup-python, which pinned 3.11 here and nowhere else: a
      # contributor's ambient python3 was whatever their OS shipped.
      - name: Install flox
        uses: flox/install-flox-action@c94e7e1ab56ae14fe98bae4fd84384fd135f0c2a # main

      - name: Free deterministic unit tests (always)
        working-directory: evals/floxify
        env:
          FLOX_DISABLE_METRICS: "true"
        shell: flox activate -- bash --noprofile --norc -e -o pipefail {0}
        run: |
          set -u
          # Keeps the required check meaningful rather than a rubber stamp: no
          # credentials, no network, no API spend — and unlike the judge, these
          # cannot be confidently wrong. This is the ONLY place these run: a
          # separate unit-tests job would duplicate the work, and `evals` has
          # to report on every PR regardless (required check).
          #
          # `flox` IS on PATH here now (it supplies python3), where it used to
          # be absent. Nothing in this step calls the catalog: every flox-
          # touching check is either mocked at its subprocess boundary or
          # explicitly switched off below. The one guarantee that used to rest
          # on flox's ambient absence is the golden lint's, and it was already
          # written not to — see FLOXIFY_GOLDEN_LINT_LIVE_CATALOG=0 below,
          # which is now load-bearing rather than belt-and-braces.
          #
          # TWO commands, not one, and neither subsumes the other (AI-509
          # Ticket 2 review). `discover` is what stops this list drifting from
          # the tests/ package: it enumerates nothing by hand, so a module
          # added to tests/ is gated the day it lands rather than green by
          # omission — which is how tests.test_stretch (wired in by hand in
          # Ticket 3) and tests.test_stretch_golden_lint (still named by no
          # job before this change) went unrun here for their whole life.
          # But discovery collects ZERO of tests/test_detect.py: that module is
          # plain `def test_*` functions with a hand-rolled runner, not
          # TestCase subclasses, so `-m unittest tests.test_detect` is a
          # vacuous green (Ran 0 tests / OK / exit 0) rather than a load error.
          # Folding its script call into the discover line would silently drop
          # 42 analyzer checks. Keep both.
          echo "::group::detect.py (analyzer extraction -- script form ON PURPOSE)"
          python3 tests/test_detect.py
          echo "::endgroup::"
          # Everything else, discovered. FLOXIFY_GOLDEN_LINT_LIVE_CATALOG=0 is
          # pinned EXPLICITLY, and now covers the two golden-lint modules
          # (tests.test_real_world_golden_lint and the newly-gated
          # tests.test_stretch_golden_lint) whose lock legs BOTH default that
          # switch on: their no-network guarantee must not rest on flox merely
          # happening to be absent from this runner, and since AI-509 flox is
          # NOT absent -- it supplies python3 -- so the switch is the only
          # thing making this run catalog-free, exactly the case it was
          # written for. Their real, catalog-backed run (with teeth against
          # catalog drift) is the golden-lint job below. The rest is mocked at
          # its subprocess boundary: verify.py (AI-461) at `_run_show_command`,
          # etc.
          echo "::group::everything unittest can discover (real_world, verify, run_floxify, stretch, ...)"
          FLOXIFY_GOLDEN_LINT_LIVE_CATALOG=0 python3 -m unittest discover -s tests -t . -v
          echo "::endgroup::"

      - name: Free deterministic unit tests -- eval harness (run.py, screen.py)
        working-directory: evals/flox
        env:
          FLOX_DISABLE_METRICS: "true"
        shell: flox activate -- bash --noprofile --norc -e -o pipefail {0}
        run: |
          set -u
          # Same discipline as the step above: no catalog, no credentials, no
          # network, no API spend. These suites test the harness itself
          # (run.py, screen.py) rather than the /floxify skill, and import
          # their modules by bare name (`import run`, `import screen`), so
          # they need evals/flox/ -- their own suite root -- as the sys.path
          # root (AI-509 Ticket 2). `python3 -m` puts the working directory
          # there, and the tests are addressed as `tests.<module>` because
          # each suite now owns a tests/ package. A separate step rather than
          # folding them into the evals/floxify step above, which needs
          # evals/floxify/ instead -- and a package named `tests` on each side
          # is exactly why one process cannot span both.
          #
          # `discover` rather than a hand-written module list, for the same
          # anti-drift reason as the step above (AI-509 Ticket 2 review). Here
          # it is a clean substitution: all of this suite's tests are TestCase
          # subclasses, so discovery misses none of them, and none is a
          # networked or paid leg. It covers run.py's and screen.py's
          # deterministic pieces; gen_screening_report.py's rule that a report
          # may only claim what was measured; and skill_toml_lint.py's own
          # logic -- fence extraction, skip markers, the structural/catalog
          # tier split, allowlist staleness, all mocked at the subprocess
          # boundary, so no flox here; the live `flox edit` run is the
          # skill-toml-lint job below. That suite is what makes this guard
          # trustworthy enough to gate on: an extractor that silently dropped
          # blocks would report "0 failed" forever.
          #
          # tests/test_skill_module_loader.py used to run here via `cd
          # ../floxify`. It is a regression test for the FLOXIFY suite's module
          # loading and lives in that suite's package, so the step above now
          # discovers it where it belongs -- the cd hack was the enumeration
          # working around itself.
          echo "::group::everything unittest can discover (run, screen, gen_screening_report, skill_toml_lint)"
          python3 -m unittest discover -s tests -t . -v
          echo "::endgroup::"

      # No setup-node / `npm install -g @anthropic-ai/claude-code` here any
      # more: the Flox environment activated below already installs
      # `flox/claude-code` (it is what the manifest's claude-code pkg-group is
      # for), and activation puts it ahead of any npm global bin on PATH — so
      # an npm install would have been a download nothing then resolved to.
      # The agent under test is now pinned by manifest.lock like everything
      # else, which is the point: an eval whose agent floats to npm `latest`
      # can move between runs for reasons that have nothing to do with the
      # skill. Secrets are untouched — the key below is still the only
      # credential this job sees.
      - name: Run skills eval gate
        if: steps.changes.outputs.run == 'true'
        env:
          # Org-managed key (provisioned for the skills repo); `claude` reads ANTHROPIC_API_KEY.
          ANTHROPIC_API_KEY: ${{ secrets.MANAGED_SKILLS_ANTHROPIC_API_KEY }}
          FLOX_DISABLE_METRICS: "true"
          # PR events always gate on the skills arm; workflow_dispatch may pick a
          # different arm and turn the gate off (e.g. to measure the baseline).
          EVAL_MODE: ${{ github.event.inputs.mode || 'skills' }}
          EVAL_GATE: ${{ github.event.inputs.gate || 'true' }}
        shell: flox activate -- bash --noprofile --norc -e -o pipefail {0}
        run: |
          args=(--mode "$EVAL_MODE" --concurrency 8)
          if [ "$EVAL_GATE" = "true" ]; then
            args+=(--gate)
          fi
          python3 evals/flox/run.py "${args[@]}"

      - name: Upload eval results
        if: ${{ always() && steps.changes.outputs.run == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: eval-results-${{ github.event.inputs.mode || 'skills' }}
          path: evals/flox/results/

  golden-lint:
    # Golden-manifest lint (verify.py, no claude — AI-456 item 2). Unlike
    # floxify-evals/floxify-real-world below, this spawns no `claude` agent and
    # costs zero Anthropic API spend (only `flox install` + `flox show`/
    # `flox list -c` calls, no closure realization), so it does NOT need
    # their dispatch-only cost gate — it runs per-PR via the `changes`
    # filter, exactly as this workflow's header comment describes, PLUS
    # on manual dispatch and (if the schedule trigger is restored)
    # weekly. This is where KNOWN_VIOLATIONS (test_real_world_golden_lint.py) gets
    # real teeth against catalog drift; the free `evals` step above only
    # proves the allowlist machinery imports (no flox there by design).
    # Also where the whole-manifest lock-resolution leg (AI-479) gets its
    # only teeth: it needs the same live flox + network this job already
    # provides, and skips cleanly in the free step's flox-less run.
    needs: changes
    if: >-
      (github.event_name == 'pull_request' && needs.changes.outputs.floxify == 'true') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install flox
        uses: flox/install-flox-action@c94e7e1ab56ae14fe98bae4fd84384fd135f0c2a # main

      - name: Golden-manifest lint (verify.py against the real-world goldens in expected/)
        working-directory: evals/floxify
        env:
          FLOX_DISABLE_METRICS: "true"
        shell: flox activate -- bash --noprofile --norc -e -o pipefail {0}
        run: |
          # Same checker as the free `evals` step, but WITH flox+network,
          # so the catalog leg (pkg-path/version/per-system resolution)
          # actually runs instead of skipping cleanly. Scope is the eight
          # goldens named in real-world.jsonl, NOT every file in expected/:
          # since AI-509 Ticket 3 that directory holds all three suites'
          # reference manifests (20 .toml), and selection here is by
          # registry. The stretch lint covers six more; the six synthetic
          # goldens are linted by neither.
          # KNOWN_VIOLATIONS is an explicit allowlist (AI-457
          # burns it down); a failure here means a genuinely NEW, unlisted
          # catalog defect. This single invocation also runs the
          # whole-manifest lock-resolution leg (AI-479, one
          # test_<fixture>_locks_cleanly per golden) — no separate command
          # needed, the dynamically-generated tests are collected the same
          # way the per-package violation tests already are. A failure
          # there means a golden whose packages each resolve individually
          # but cannot co-resolve together on any catalog page
          # ("constraints for group 'X' are too tight") — a real
          # cross-pkg-group finding the per-package checks above cannot
          # see, not something to allowlist.
          #
          # Same interpreter as every other job (AI-509): python3 comes from
          # this repo's Flox environment, activated once by this step's
          # `shell:` key. The nested `flox init` / `flox list -c` calls the
          # lint makes run against their own throwaway environments in temp
          # dirs, unaffected by that activation.
          python3 -m unittest tests.test_real_world_golden_lint -v

  skill-toml-lint:
    # Parse-check every fenced ```toml block the flox skill SHIPS (AI-494).
    # The floxify evals check manifests the model GENERATES; this checks the
    # ones a user copy-pastes out of SKILL.md / references/*.md, by feeding
    # each to `flox edit -f` in a throwaway `flox init` env.
    #
    # Same cost profile as golden-lint, and gated the same way: it spawns no
    # `claude` and costs zero Anthropic spend, so it does NOT need the
    # dispatch-only gate the paid floxify jobs carry. It runs per-PR via the
    # `changes` filter, plus on manual dispatch.
    #
    # --offline points the proxy vars at a closed port, so the structural
    # tier is proven to need no catalog: it behaves identically here and on
    # an air-gapped machine, and a catalog outage can never redden this job.
    # flox parses the whole manifest before resolving anything, so this still
    # catches every [install] bug. The catalog tier (--tier catalog) is
    # advisory and deliberately not run in CI.
    needs: changes
    if: >-
      (github.event_name == 'pull_request' && needs.changes.outputs.skill_toml == 'true') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install flox
        uses: flox/install-flox-action@c94e7e1ab56ae14fe98bae4fd84384fd135f0c2a # main

      - name: Parse-check the flox skill's TOML snippets
        working-directory: evals/flox
        env:
          FLOX_DISABLE_METRICS: "true"
        shell: flox activate -- bash --noprofile --norc -e -o pipefail {0}
        run: |
          set -u
          # python3 from this repo's Flox environment (AI-509). --offline
          # still points the proxy vars at a closed port for the throwaway
          # `flox init` envs the lint drives, so the structural tier remains
          # provably catalog-free.
          python3 skill_toml_lint.py --offline --verbose \
            --json results/skill-toml-lint.json

      - name: Upload skill TOML lint results
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: skill-toml-lint-results
          path: evals/flox/results/skill-toml-lint.json

  floxify-evals:
    # Synthetic-fixture outcome-based /floxify eval — runs the skill against synthetic
    # fixture repos and verifies the manifest it produces (plus `flox
    # activate`). Needs a live flox + catalog, so it runs weekly, on manual
    # dispatch, and on PRs that touch the floxify eval sources or the skill
    # (via the `changes` filter). --gate binds on should-tier hard-checks;
    # judge score and activation are advisory.
    needs: changes
    # Dispatch-only: this spends real Opus money (6 fixtures x agent+judge =
    # 12 calls) and needs a live flox + catalog. The per-PR and weekly paths
    # are retired until the suite is trustworthy again.
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.run_floxify == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install flox
        uses: flox/install-flox-action@c94e7e1ab56ae14fe98bae4fd84384fd135f0c2a # main

      # Both the interpreter and the `claude` CLI now come from this repo's
      # Flox environment (AI-509), replacing setup-python + setup-node + an
      # `npm install -g @anthropic-ai/claude-code` that activation's PATH
      # would have shadowed anyway. Secrets unchanged: the API key below is
      # still the only credential this job sees.
      - name: Run /floxify outcome eval gate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.MANAGED_SKILLS_ANTHROPIC_API_KEY }}
          FLOX_DISABLE_METRICS: "true"
        shell: flox activate -- bash --noprofile --norc -e -o pipefail {0}
        run: |
          python3 evals/floxify/run_floxify.py \
            --gate \
            --out "results/floxify-ci.json"

      - name: Upload floxify eval results
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: floxify-eval-results
          # AI-442: results/streams/ holds raw per-rep agent stream-json
          # transcripts (one per fixture even on a default single-rep
          # run) -- large and not useful as a CI artifact; excluded the
          # same way evals/floxify/.gitignore excludes them from commits.
          path: |
            evals/floxify/results/
            !evals/floxify/results/streams/

  floxify-real-world:
    # Real-world outcome eval — runs /floxify against a real OSS repo cloned at a
    # pinned SHA and scores structural conformance (runtime pins + service
    # wiring). Same trigger as the synthetic tier (schedule / manual / floxify-touching
    # PR). REPORT-ONLY: real_world.py has no --gate, so this job never fails the
    # build on eval outcome. Activation stays OFF for CI cost — the manifest's
    # hook commands (e.g. Ruby's bundler pin) are not validated here; a live
    # Ruby-activation run is a known follow-up (AI-431).
    needs: changes
    # Dispatch-only: this spends real Opus money (6 fixtures x agent+judge =
    # 12 calls) and needs a live flox + catalog. The per-PR and weekly paths
    # are retired until the suite is trustworthy again.
    # Dispatch-only for the same reason: clones real repos, runs a full
    # agentic pass, and realizes whole closures.
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.run_floxify == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install flox
        uses: flox/install-flox-action@c94e7e1ab56ae14fe98bae4fd84384fd135f0c2a # main

      # Interpreter and `claude` from this repo's Flox environment (AI-509),
      # same as floxify-evals above. Secrets unchanged.
      - name: Run /floxify real-world eval (report-only, mastodon)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.MANAGED_SKILLS_ANTHROPIC_API_KEY }}
          FLOX_DISABLE_METRICS: "true"
        shell: flox activate -- bash --noprofile --norc -e -o pipefail {0}
        run: |
          python3 evals/floxify/real_world.py \
            --only mastodon \
            --out "results/real-world.json"

      - name: Upload floxify real-world eval results
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: floxify-real-world-results
          path: evals/floxify/results/real-world.json
