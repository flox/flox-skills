name: skill-evals

# Gates changes to the Flox skill / eval suite on the eval harness:
# run.py --gate exits non-zero only if a functional `should`-tier task fails its
# deterministic hard-checks. Judge score and implicit-triggering rate are
# probabilistic, so they're reported but never block. Agent + judge run via
# `claude`, authenticated with the org-managed Anthropic key.
#
# The job runs on every pull request so the required `evals` status check always
# reports. The heavy suite runs only when the skill or eval sources change
# (flox-plugin/**, evals/**, or this workflow); other PRs short-circuit to a
# passing check so a path-filtered gate never wedges docs/config PRs.
#
# workflow_dispatch can pick an arm (skills / baseline / skills+mcp) and toggle
# the gate — e.g. to measure the bare-model baseline without failing the run.
#
# The floxify jobs (floxify-evals = Tier 1, floxify-tier2 = Tier 2) are
# SEPARATE from the per-PR skills gate. The /floxify evals are outcome-based:
# they run the skill against fixture/real repos and need a live flox + catalog
# + network, so they are too slow and too environment-dependent to gate every
# PR. They run weekly, on manual dispatch (run_floxify=true), and — via the
# `changes` job below — on pull requests that actually touch the floxify eval
# sources or the skill (evals/floxify/** or flox-plugin/skills/**). They never
# run on unrelated PRs, and they never gate: Tier 1 reports its own hard-check
# gate only on schedule/dispatch, and Tier 2 is report-only in all modes.
on:
  pull_request:
  schedule:
    # Weekly regression watch for the /floxify skill — Monday 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      mode:
        description: "Eval arm to run (skills job)"
        type: choice
        options:
          - skills
          - baseline
          - skills+mcp
        default: skills
      gate:
        description: "Fail the run on should-tier hard-check failures"
        type: boolean
        default: true
      run_floxify:
        description: "Also run the /floxify outcome eval (needs live flox)"
        type: boolean
        default: false

concurrency:
  group: skill-evals-${{ github.ref }}-${{ github.event.inputs.mode || 'skills' }}
  cancel-in-progress: true

jobs:
  changes:
    # Path filter that decides whether a PR touches the floxify eval sources or
    # the skill. Runs on ALL events (no job-level `if`) so it never propagates a
    # skip to the floxify jobs that `needs:` it — on schedule/dispatch the
    # filter step is skipped and the output is empty, which is fine because
    # those event branches of the floxify `if` don't consult it. This job does
    # NOT gate the fast `evals` (skills) job, which keeps running on every PR.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      floxify: ${{ steps.filter.outputs.floxify }}
    steps:
      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            floxify:
              - 'evals/floxify/**'
              - 'flox-plugin/skills/**'

  evals:
    # Per-PR skills gate. Skipped on the weekly schedule (that run is for the
    # floxify job); still runs on pull_request and workflow_dispatch.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Detect skill/eval changes
        id: changes
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "Non-PR event; running the full eval suite."
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only \
                 "${{ github.event.pull_request.base.sha }}" \
                 "${{ github.event.pull_request.head.sha }}" \
               | grep -qE '^(flox-plugin/|evals/|[.]github/workflows/evals[.]yml)'; then
            echo "Skill/eval sources changed; running the full eval suite."
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No skill/eval changes; reporting evals as passed without running the suite."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: steps.changes.outputs.run == 'true'
        with:
          python-version: "3.11"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.changes.outputs.run == 'true'
        with:
          node-version: "20"

      - name: Install Claude Code CLI
        if: steps.changes.outputs.run == 'true'
        run: npm install -g @anthropic-ai/claude-code

      # Only the skills+mcp arm needs flox — its MCP config runs
      # `flox activate -r flox/flox-mcp-server -- flox-mcp`. Normal PR (skills)
      # runs skip this so they stay fast and flox-free.
      - name: Install flox (skills+mcp arm only)
        if: ${{ steps.changes.outputs.run == 'true' && github.event.inputs.mode == 'skills+mcp' }}
        uses: flox/install-flox-action@c94e7e1ab56ae14fe98bae4fd84384fd135f0c2a # main

      - name: Run skills eval gate
        if: steps.changes.outputs.run == 'true'
        env:
          # Org-managed key (provisioned for the skills repo); `claude` reads ANTHROPIC_API_KEY.
          ANTHROPIC_API_KEY: ${{ secrets.MANAGED_SKILLS_ANTHROPIC_API_KEY }}
          FLOX_DISABLE_METRICS: "true"
          # PR events always gate on the skills arm; workflow_dispatch may pick a
          # different arm and turn the gate off (e.g. to measure the baseline).
          EVAL_MODE: ${{ github.event.inputs.mode || 'skills' }}
          EVAL_GATE: ${{ github.event.inputs.gate || 'true' }}
        run: |
          args=(--mode "$EVAL_MODE" --concurrency 8)
          if [ "$EVAL_GATE" = "true" ]; then
            args+=(--gate)
          fi
          python3 evals/run.py "${args[@]}"

      - name: Upload eval results
        if: ${{ always() && steps.changes.outputs.run == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: eval-results-${{ github.event.inputs.mode || 'skills' }}
          path: evals/results/

  floxify-evals:
    # Tier 1 outcome-based /floxify eval — runs the skill against synthetic
    # fixture repos and verifies the manifest it produces (plus `flox
    # activate`). Needs a live flox + catalog, so it runs weekly, on manual
    # dispatch, and on PRs that touch the floxify eval sources or the skill
    # (via the `changes` filter). --gate binds on should-tier hard-checks;
    # judge score and activation are advisory.
    needs: changes
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.run_floxify == 'true') || (github.event_name == 'pull_request' && needs.changes.outputs.floxify == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # The skill under test lives in a separate repo. Check out the branch that
      # holds it; retarget to main after the floxify PR merges.
      - name: Check out claude-plugins (skill under test)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: flox/claude-plugins
          ref: add-floxify-skill
          path: claude-plugins

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Install flox
        uses: flox/install-flox-action@c94e7e1ab56ae14fe98bae4fd84384fd135f0c2a # main

      - name: Run /floxify outcome eval gate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.MANAGED_SKILLS_ANTHROPIC_API_KEY }}
          FLOX_DISABLE_METRICS: "true"
        run: |
          python3 evals/floxify/run_floxify.py \
            --gate \
            --skill-dir "$GITHUB_WORKSPACE/claude-plugins" \
            --out "results/floxify-ci.json"

      - name: Upload floxify eval results
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: floxify-eval-results
          path: evals/floxify/results/

  floxify-tier2:
    # Tier 2 outcome eval — runs /floxify against a real OSS repo cloned at a
    # pinned SHA and scores structural conformance (runtime pins + service
    # wiring). Same trigger as Tier 1 (schedule / manual / floxify-touching
    # PR). REPORT-ONLY: tier2.py has no --gate, so this job never fails the
    # build on eval outcome. Activation stays OFF for CI cost — the manifest's
    # hook commands (e.g. Ruby's bundler pin) are not validated here; a live
    # Ruby-activation run is a known follow-up (AI-431).
    needs: changes
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.run_floxify == 'true') || (github.event_name == 'pull_request' && needs.changes.outputs.floxify == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # The skill under test lives in a separate repo. Check out the branch that
      # holds it; retarget to main after the floxify PR merges.
      - name: Check out claude-plugins (skill under test)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: flox/claude-plugins
          ref: add-floxify-skill
          path: claude-plugins

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Install flox
        uses: flox/install-flox-action@c94e7e1ab56ae14fe98bae4fd84384fd135f0c2a # main

      - name: Run /floxify Tier 2 eval (report-only, mastodon)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.MANAGED_SKILLS_ANTHROPIC_API_KEY }}
          FLOX_DISABLE_METRICS: "true"
        run: |
          python3 evals/floxify/tier2.py \
            --only mastodon \
            --skill-dir "$GITHUB_WORKSPACE/claude-plugins" \
            --out "results/tier2.json"

      - name: Upload floxify Tier 2 eval results
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: floxify-tier2-results
          path: evals/floxify/results/tier2.json
