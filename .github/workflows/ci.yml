name: "CI"

# Builds and publishes the `skills-flox` Flox package (defined as
# [build.skills-flox] in .flox/env/manifest.toml) to the flox catalog.
#
# Modeled on flox/flox-ai's ci.yml and the floxenvs skills-* packages:
#   - PRs (and a dispatch with publish=false) only BUILD, per system.
#   - Pushes to main (and a dispatch with publish=true) PUBLISH to
#     `flox/skills-flox` for every system.
#
# The `Summary` job is a REQUIRED status check on main (with `evals` from
# evals.yml). Required checks constrain the trigger, not just the job graph:
# this workflow must start on every pull_request so that context reports,
# and path gating happens in the `changes` job instead. See the note on the
# pull_request trigger below.
#
# Cross-system builds run on ubuntu runners via remote builders reached
# over Tailscale, with the private R2 cache configured through
# flox/configure-nix-action — exactly as flox-ai builds its four systems.
# Publishing needs FLOX_FLOXHUB_TOKEN (repo/org secret, provisioned
# outside deltaops, same as flox-ai). The MANAGED_* secrets/vars are
# provisioned to this repo by deltaops (packages/sync-secrets-to-github.nix).

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish skills-flox to the flox catalog"
        type: boolean
        default: false
  # Push KEEPS its path filter: a main push with none of these paths touched
  # has nothing to publish, and the Publish step below fires on every push
  # event, so the trigger filter is what stops a pointless `flox publish`.
  # Nothing gates pushes to main on a status check, so skipping the whole
  # workflow here costs nothing.
  push:
    branches:
      - main
    paths:
      - "flox-plugin/**"
      - ".flox/**"
      - ".github/workflows/ci.yml"
  # Pull requests are DELIBERATELY unfiltered. `Summary` below is a required
  # status check on main, and a required context that is skipped at the
  # TRIGGER level is not "skipped" to branch protection — the workflow never
  # runs, so the context is never reported at all, and the PR sits at
  # "Expected — Waiting for status to be reported" forever. That is not the
  # same as a job being conditionally skipped, which DOES report. A path
  # filter here therefore wedges every PR that does not touch these paths.
  # Path gating moved to the `changes` job below, exactly as evals.yml does
  # it for its own required `evals` context.
  pull_request:

concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: true

env:
  FLOX_DISABLE_METRICS: "true"

jobs:
  changes:
    # The path filter that USED to live on the pull_request trigger. As a job
    # it runs on every event with no job-level `if`, so it never propagates a
    # skip to what `needs:` it; on push/workflow_dispatch the filter step is
    # skipped and the output is empty, which is fine because those event
    # branches of build-and-publish's `if` don't consult it. Same shape and
    # same pinned action as evals.yml's `changes` job.
    #
    # The filter list is the old trigger list, unchanged, ci.yml included:
    # moving WHERE the paths are evaluated should not quietly change WHICH
    # paths build. Keeping this file in it means a PR editing the workflow
    # still exercises the real four-system build rather than trusting a
    # review of the YAML.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      build: ${{ steps.filter.outputs.build }}
    steps:
      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            build:
              - 'flox-plugin/**'
              - '.flox/**'
              - '.github/workflows/ci.yml'

  build-and-publish:
    name: "Build and Publish (${{ matrix.system }})"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: ["changes"]
    # Gated at the JOB level rather than around the `Build package` step: a
    # step-level `if` would still spin up four runners to do a fetch-depth-0
    # checkout, a Tailscale handshake and a full Nix/R2 configure before
    # deciding there is nothing to build. Skipping the job is what evals.yml's
    # floxify/golden-lint jobs do with the same `needs.changes.outputs` value,
    # and it is what the `skipped == pass` branch in Summary below was already
    # written for. Non-PR events short-circuit before consulting the filter,
    # whose output is empty there.
    if: >-
      ${{ github.event_name != 'pull_request'
        || needs.changes.outputs.build == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        system:
          - x86_64-linux
          - aarch64-linux
          - x86_64-darwin
          - aarch64-darwin
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          filter: blob:none

      - name: "Setup Tailscale"
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4
        if: ${{ vars.MANAGED_TAILSCALE_URL != '' }}
        with:
          oauth-secret: ${{ secrets.MANAGED_TAILSCALE_AUTH_KEY }}
          tags: "tag:ci"
          timeout: "30s"
          use-cache: true

      - name: "Install Flox"
        uses: flox/install-flox-action@3b80351ae97bbe063f264dc88fbd505507054963 # v2.5.3

      - name: "Configure Nix"
        uses: flox/configure-nix-action@28a4eb7f63bf54c91670b4a698f0a9ebfb95384f # main
        with:
          github-access-token: ${{ secrets.MANAGED_FLOXBOT_GITHUB_ACCESS_TOKEN_REPO_SCOPE }}
          substituter: ${{ vars.MANAGED_CACHE_PRIVATE_R2_BUCKET }}
          substituter-key: ${{ secrets.MANAGED_CACHE_PRIVATE_SECRET_KEY }}
          aws-access-key-id: ${{ secrets.MANAGED_CACHE_PRIVATE_R2_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.MANAGED_CACHE_PRIVATE_R2_SECRET_ACCESS_KEY }}
          ssh-key: ${{ secrets.MANAGED_FLOXBOT_SSH_KEY }}
          remote-builders: ${{ vars.MANAGED_REMOTE_BUILDERS }}

      - name: "Build package"
        if: >-
          ${{ github.event_name == 'pull_request'
            || (github.event_name == 'workflow_dispatch'
                && inputs.publish == false) }}
        run: flox build skills-flox --system ${{ matrix.system }}

      - name: "Publish package"
        if: >-
          ${{ github.event_name == 'push'
            || (github.event_name == 'workflow_dispatch'
                && inputs.publish == true) }}
        run: flox publish -o flox skills-flox --system ${{ matrix.system }}
        env:
          FLOX_FLOXHUB_TOKEN: ${{ secrets.MANAGED_FLOX_FLOXHUB_TOKEN }}

  # Single required status: collapses the per-system matrix into one
  # pass/fail. always() so it reports even when a leg fails; it then
  # fails itself if any leg did, so branch protection can gate on this
  # one context instead of four shifting matrix names.
  #
  # `changes` is in needs: alongside build-and-publish so this job can tell
  # the two reasons build-and-publish reports "skipped" apart. always() only
  # promises Summary runs once its needs SETTLE, and build-and-publish
  # already needs changes, so the ordering was safe transitively — but
  # without the direct edge, needs.changes.result is not in scope here and a
  # crashed path filter would skip the build and be read as "nothing to
  # build", i.e. a green required check on an unbuilt PR.
  summary:
    name: "Summary"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: ["changes", "build-and-publish"]
    if: always()
    steps:
      - name: "Check build/publish result"
        env:
          CHANGES: ${{ needs.changes.result }}
          RESULT: ${{ needs.build-and-publish.result }}
        run: |
          set -euo pipefail
          echo "changes: $CHANGES"
          echo "build-and-publish: $RESULT"
          # A skipped build is only good news if the thing that decided to
          # skip it actually ran. `changes` carries no job-level `if`, so on
          # every event a healthy run reports success.
          if [ "$CHANGES" != "success" ]; then
            echo "Path filter did not succeed; a skipped build proves nothing."
            exit 1
          fi
          # skipped == no matching paths changed; treat as pass.
          if [ "$RESULT" = "success" ] || [ "$RESULT" = "skipped" ]; then
            echo "All systems OK."
            exit 0
          fi
          echo "One or more systems failed."
          exit 1

  # Slack #pod-ai only when a main publish actually failed — PRs surface
  # failures in the checks UI and shouldn't page the channel. Reuses the
  # org MANAGED_SLACK_WEBHOOK with a SLACK_CHANNEL override, same as
  # claude-plugins.
  report-failure:
    name: "Report Failure"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: ["summary"]
    if: >-
      always()
      && github.event_name == 'push'
      && github.ref_name == 'main'
      && needs.summary.result == 'failure'
    steps:
      - name: "Slack Notification"
        uses: rtCamp/action-slack-notify@33ca3be66c6f378fe1610fd1d5258632dbed5e58 # v2
        env:
          SLACK_CHANNEL: "pod-ai"
          SLACK_WEBHOOK: "${{ secrets.MANAGED_SLACK_WEBHOOK }}"
          SLACK_TITLE: "flox-skills publish failed on main"
          SLACK_MESSAGE: >-
            skills-flox failed to publish
            (<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|run>).
          SLACK_FOOTER: "flox-skills"
          SLACK_USERNAME: "GitHub"
          SLACK_ICON_EMOJI: ":poop:"
          SLACK_COLOR: "#ff2800"
          SLACK_LINK_NAMES: true
