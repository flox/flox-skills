name: "CI"

# Builds and publishes the `skills-flox` Flox package (defined as
# [build.skills-flox] in .flox/env/manifest.toml) to the flox catalog.
#
# Modeled on flox/flox-ai's ci.yml and the floxenvs skills-* packages:
#   - PRs (and a dispatch with publish=false) only BUILD, per system.
#   - Pushes to main (and a dispatch with publish=true) PUBLISH to
#     `flox/skills-flox` for every system.
#
# Cross-system builds run on ubuntu runners via remote builders reached
# over Tailscale, with the private R2 cache configured through
# flox/configure-nix-action — exactly as flox-ai builds its four systems.
# Publishing needs FLOX_FLOXHUB_TOKEN (repo/org secret, provisioned
# outside deltaops, same as flox-ai). The MANAGED_* secrets/vars are
# provisioned to this repo by deltaops (packages/sync-secrets-to-github.nix).

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish skills-flox to the flox catalog"
        type: boolean
        default: false
  push:
    branches:
      - main
    paths:
      - "flox-plugin/**"
      - ".flox/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "flox-plugin/**"
      - ".flox/**"
      - ".github/workflows/ci.yml"

concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: true

env:
  FLOX_DISABLE_METRICS: "true"

jobs:
  build-and-publish:
    name: "Build and Publish (${{ matrix.system }})"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        system:
          - x86_64-linux
          - aarch64-linux
          - x86_64-darwin
          - aarch64-darwin
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          filter: blob:none

      - name: "Setup Tailscale"
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4
        if: ${{ vars.MANAGED_TAILSCALE_URL != '' }}
        with:
          oauth-secret: ${{ secrets.MANAGED_TAILSCALE_AUTH_KEY }}
          tags: "tag:ci"
          timeout: "30s"
          use-cache: true

      - name: "Install Flox"
        uses: flox/install-flox-action@3b80351ae97bbe063f264dc88fbd505507054963 # v2.5.3

      - name: "Configure Nix"
        uses: flox/configure-nix-action@1ee58d63463cb1870ab73d9df0acfd9d8ba671f8 # main
        with:
          github-access-token: ${{ secrets.MANAGED_FLOXBOT_GITHUB_ACCESS_TOKEN_REPO_SCOPE }}
          substituter: ${{ vars.MANAGED_CACHE_PRIVATE_R2_BUCKET }}
          substituter-key: ${{ secrets.MANAGED_CACHE_PRIVATE_SECRET_KEY }}
          aws-access-key-id: ${{ secrets.MANAGED_CACHE_PRIVATE_R2_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.MANAGED_CACHE_PRIVATE_R2_SECRET_ACCESS_KEY }}
          ssh-key: ${{ secrets.MANAGED_FLOXBOT_SSH_KEY }}
          remote-builders: ${{ vars.MANAGED_REMOTE_BUILDERS }}

      - name: "Build package"
        if: >-
          ${{ github.event_name == 'pull_request'
            || (github.event_name == 'workflow_dispatch'
                && inputs.publish == false) }}
        run: flox build skills-flox --system ${{ matrix.system }}

      - name: "Publish package"
        if: >-
          ${{ github.event_name == 'push'
            || (github.event_name == 'workflow_dispatch'
                && inputs.publish == true) }}
        run: flox publish -o flox skills-flox --system ${{ matrix.system }}
        env:
          FLOX_FLOXHUB_TOKEN: ${{ secrets.MANAGED_FLOX_FLOXHUB_TOKEN }}

  # Single required status: collapses the per-system matrix into one
  # pass/fail. always() so it reports even when a leg fails; it then
  # fails itself if any leg did, so branch protection can gate on this
  # one context instead of four shifting matrix names.
  summary:
    name: "Summary"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: ["build-and-publish"]
    if: always()
    steps:
      - name: "Check build/publish result"
        env:
          RESULT: ${{ needs.build-and-publish.result }}
        run: |
          set -euo pipefail
          echo "build-and-publish: $RESULT"
          # skipped == no matching paths changed; treat as pass.
          if [ "$RESULT" = "success" ] || [ "$RESULT" = "skipped" ]; then
            echo "All systems OK."
            exit 0
          fi
          echo "One or more systems failed."
          exit 1

  # Slack #pod-ai only when a main publish actually failed — PRs surface
  # failures in the checks UI and shouldn't page the channel. Reuses the
  # org MANAGED_SLACK_WEBHOOK with a SLACK_CHANNEL override, same as
  # claude-plugins.
  report-failure:
    name: "Report Failure"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: ["summary"]
    if: >-
      always()
      && github.event_name == 'push'
      && github.ref_name == 'main'
      && needs.summary.result == 'failure'
    steps:
      - name: "Slack Notification"
        uses: rtCamp/action-slack-notify@33ca3be66c6f378fe1610fd1d5258632dbed5e58 # v2
        env:
          SLACK_CHANNEL: "pod-ai"
          SLACK_WEBHOOK: "${{ secrets.MANAGED_SLACK_WEBHOOK }}"
          SLACK_TITLE: "flox-skills publish failed on main"
          SLACK_MESSAGE: >-
            skills-flox failed to publish
            (<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|run>).
          SLACK_FOOTER: "flox-skills"
          SLACK_USERNAME: "GitHub"
          SLACK_ICON_EMOJI: ":poop:"
          SLACK_COLOR: "#ff2800"
          SLACK_LINK_NAMES: true
