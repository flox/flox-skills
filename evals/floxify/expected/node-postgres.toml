schema-version = "1.10.0"
# Generated by /floxify

# Node.js 20 + PostgreSQL environment.
# Merged from flox/javascript-node + flox/postgresql patterns.
# PostgreSQL wired as a Flox service (no docker-compose.yml detected).
# DATABASE_URL detected in .env.example.
# NOTE: auth=trust is dev-only — not safe for shared machines.

[install]
nodejs.pkg-path = "nodejs_20"
nodejs.pkg-group = "javascript-node"
postgresql.pkg-path = "postgresql"
postgresql.pkg-group = "postgresql"

[vars]
NODE_ENV = "development"
PGHOST = "127.0.0.1"
PGPORT = "5432"
PGUSER = "postgres"
PGDATABASE = "myapp_dev"

[hook]
on-activate = '''
export PGDATA="$FLOX_ENV_CACHE/postgres"

if [ ! -d "$PGDATA" ]; then
  initdb -D "$PGDATA" \
    --username="$PGUSER" \
    --auth=trust \
    --no-locale \
    --encoding=UTF8 >&2
fi

export NODE_CACHE="$FLOX_ENV_CACHE/node"
mkdir -p "$NODE_CACHE"
export npm_config_cache="$NODE_CACHE/npm-cache"

if [ -f package.json ] && [ -f package-lock.json ]; then
  HASH=$(cat package.json package-lock.json | sha256sum | cut -d" " -f1)
  LAST=$(cat "$NODE_CACHE/packages-hash" 2>/dev/null)
  if [ "$HASH" != "$LAST" ]; then
    npm install
    echo "$HASH" > "$NODE_CACHE/packages-hash"
  fi
fi
'''

[services.postgres]
command = '''
  exec postgres \
    -D "$FLOX_ENV_CACHE/postgres" \
    -p "$PGPORT" \
    -k /tmp \
    -c listen_addresses="$PGHOST"
'''
