schema-version = "1.10.0"
# Generated by /floxify — stretch-tier fixture (AI-431)

# Conversion mode: .devcontainer/devcontainer.json → Flox manifest (full
# conversion). Pull runtimes from BOTH the image and the features:
#   image "…/devcontainers/python:3.12"        → python3
#   features "…/features/node:1" {version:20}  → nodejs_20
# containerEnv (APP_ENV, PYTHONUNBUFFERED) → [vars]; postCreateCommand
# (pip install + npm install) → [hook], with the Python side moved into a
# venv under $FLOX_ENV_CACHE (never the container's global site-packages).
# forwardPorts is dev-server metadata with no manifest equivalent.
#
# Catalog claims live-verified via `flox show` on 2026-07-21 (nixpkgs):
#   python3, nodejs_20 — both resolve on the three declared systems.

[install]
python3.pkg-path = "python3"
nodejs.pkg-path = "nodejs_20"

[vars]
APP_ENV = "development"
PYTHONUNBUFFERED = "1"

[hook]
on-activate = '''
# Python venv under the env cache (from postCreateCommand: pip install)
export VENV="$FLOX_ENV_CACHE/venv"
if [ ! -d "$VENV" ]; then
  python3 -m venv "$VENV"
fi
source "$VENV/bin/activate"
if [ -f requirements.txt ]; then
  pip install -q -r requirements.txt
fi

# Node deps (from postCreateCommand: npm install)
export NODE_CACHE="$FLOX_ENV_CACHE/node"
export npm_config_cache="$NODE_CACHE/npm-cache"
mkdir -p "$NODE_CACHE"
if [ -f package.json ]; then
  npm install
fi
'''

[profile]
bash = 'source "$FLOX_ENV_CACHE/venv/bin/activate"'
zsh = 'source "$FLOX_ENV_CACHE/venv/bin/activate"'

[options]
systems = ["x86_64-linux", "aarch64-linux", "aarch64-darwin"]
