schema-version = "1.10.0"
# Generated by /floxify — stretch-tier fixture (AI-431)

# Conversion mode: .mise.toml [tools] → Flox manifest. Each mise pin is
# an independent catalog resolution:
#   node = "20"       → nodejs_20
#   python = "3.12"   → python3
#   go = "1.22"       → go
#   terraform = "1.9" → terraform  (mise patch pins routinely sit ahead
#                       of the catalog; resolve the tool and let the
#                       catalog pick the build — the major/minor is the
#                       intent, not an exact patch)
# .mise.toml [env] (APP_ENV) → [vars].
#
# Catalog claims live-verified via `flox show` on 2026-07-21 (nixpkgs):
#   nodejs_20, python3, go, terraform — all resolve on the three declared
#   systems.

[install]
nodejs.pkg-path = "nodejs_20"
python3.pkg-path = "python3"
go.pkg-path = "go"
terraform.pkg-path = "terraform"

[vars]
APP_ENV = "development"

[hook]
on-activate = '''
export GOPATH="$FLOX_ENV_CACHE/go"
export GOMODCACHE="$FLOX_ENV_CACHE/go/pkg/mod"
export NODE_CACHE="$FLOX_ENV_CACHE/node"
export npm_config_cache="$NODE_CACHE/npm-cache"
mkdir -p "$GOPATH" "$GOMODCACHE" "$NODE_CACHE"
'''

[profile]
bash = 'export GOPATH="$FLOX_ENV_CACHE/go"; export PATH="$GOPATH/bin:$PATH"'
zsh = 'export GOPATH="$FLOX_ENV_CACHE/go"; export PATH="$GOPATH/bin:$PATH"'

[options]
systems = ["x86_64-linux", "aarch64-linux", "aarch64-darwin"]
