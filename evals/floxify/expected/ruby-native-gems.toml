schema-version = "1.10.0"
# Generated by /floxify — stretch-tier fixture (AI-431)

# Ruby app with native-extension gems (nokogiri, pg) — the case floxify
# historically choked on. Ruby 3.3.4 from .ruby-version / Gemfile.lock
# (RUBY VERSION 3.3.4p94). The native build inputs are the point:
#   - nokogiri compiles against libxml2 + libxslt
#   - pg compiles against libpq
# They share ruby's pkg-group so the C toolchain and libraries stay
# ABI-coherent with the interpreter. The hook follows floxdocs
# ruby.md: vendor gems under $FLOX_ENV_CACHE via BUNDLE_PATH/GEM_HOME,
# `unset CPATH` so gcc resolves headers through pkg-config rather than a
# stray system include path, and build nokogiri against the Flox
# libraries instead of its vendored copies.
#
# Catalog claims live-verified via `flox show` on 2026-07-21 (nixpkgs):
#   ruby@3.3.x, libxml2, libxslt, libpq, pkg-config — all resolve on the
#   three declared systems; gcc (linux) / clang (darwin) split per system.

[install]
ruby.pkg-path = "ruby"
ruby.version = "3.3"
ruby.pkg-group = "ruby"

# Native-extension build inputs (share ruby's group for ABI coherence)
libxml2.pkg-path = "libxml2"
libxml2.pkg-group = "ruby"
libxslt.pkg-path = "libxslt"
libxslt.pkg-group = "ruby"
libpq.pkg-path = "libpq"
libpq.pkg-group = "ruby"
pkg-config.pkg-path = "pkg-config"
pkg-config.pkg-group = "ruby"

# Compiler — platform split (native cc on each OS)
gcc.pkg-path = "gcc"
gcc.pkg-group = "ruby"
gcc.systems = ["x86_64-linux", "aarch64-linux"]
clang.pkg-path = "clang"
clang.pkg-group = "ruby"
clang.systems = ["aarch64-darwin"]

[vars]
RUBY_AUTO_INSTALL = "true"

[hook]
on-activate = '''
export RUBY_CACHE="$FLOX_ENV_CACHE/ruby"
export GEM_HOME="$RUBY_CACHE/gems"
export BUNDLE_PATH="$GEM_HOME"
export PATH="$GEM_HOME/bin:$PATH"
mkdir -p "$GEM_HOME"

# Native gems (nokogiri, pg) compile against the Flox libraries above.
# unset CPATH so the compiler resolves headers via pkg-config, not a
# leftover system include path (floxdocs ruby.md).
unset CPATH
# Build nokogiri against system (Flox-provided) libxml2/libxslt rather
# than downloading and compiling its own vendored copies.
export BUNDLE_BUILD__NOKOGIRI="--use-system-libraries"

if [ "$RUBY_AUTO_INSTALL" = "true" ] && [ -f Gemfile ] && [ -f Gemfile.lock ]; then
  HASH=$(cat Gemfile Gemfile.lock | sha256sum | cut -d" " -f1)
  LAST=$(cat "$RUBY_CACHE/gems-hash" 2>/dev/null)
  if [ "$HASH" != "$LAST" ]; then
    bundle install
    echo "$HASH" > "$RUBY_CACHE/gems-hash"
  fi
fi
'''

[options]
systems = ["x86_64-linux", "aarch64-linux", "aarch64-darwin"]
