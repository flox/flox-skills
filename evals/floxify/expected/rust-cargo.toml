schema-version = "1.10.0"
# Generated by /floxify

# Rust toolchain environment.
# Seeded from flox/rust; all toolchain packages share rust-toolchain pkg-group
# for version compatibility. Platform-specific linkers included.

[install]
cargo.pkg-path = "cargo"
cargo.pkg-group = "rust-toolchain"
rustc.pkg-path = "rustc"
rustc.pkg-group = "rust-toolchain"
clippy.pkg-path = "clippy"
clippy.pkg-group = "rust-toolchain"
rustfmt.pkg-path = "rustfmt"
rustfmt.pkg-group = "rust-toolchain"

# Platform-specific linkers
clang.pkg-path = "clang"
clang.systems = ["aarch64-darwin", "x86_64-darwin"]
gcc.pkg-path = "gcc"
gcc.systems = ["aarch64-linux", "x86_64-linux"]

[hook]
on-activate = '''
export CARGO_HOME="$FLOX_ENV_CACHE/cargo"
export CARGO_TARGET_DIR="$FLOX_ENV_CACHE/target"
mkdir -p "$CARGO_HOME" "$CARGO_TARGET_DIR"
'''

[profile]
bash = 'export CARGO_HOME="$FLOX_ENV_CACHE/cargo"; export PATH="$CARGO_HOME/bin:$PATH"'
zsh = 'export CARGO_HOME="$FLOX_ENV_CACHE/cargo"; export PATH="$CARGO_HOME/bin:$PATH"'
fish = 'set -x CARGO_HOME "$FLOX_ENV_CACHE/cargo"; fish_add_path "$CARGO_HOME/bin"'
