schema-version = "1.10.0"
# Generated by /floxify — Tier-3 stretch fixture (AI-431)

# Conversion mode: devbox.json → Flox manifest. DevBox and Flox both
# resolve against the Nix catalog, so package names map almost 1:1:
#   nodejs@20  → nodejs_20
#   python@3.12 → python3
#   jq@latest  → jq
# devbox.json `env` (NODE_ENV) → [vars]; `shell.init_hook` (minus the
# echo) → [hook]. devbox.json is left untouched (the skill offers to
# remove it separately).
#
# Catalog claims live-verified via `flox show` on 2026-07-21 (nixpkgs):
#   nodejs_20, python3, jq — all resolve on the three declared systems.

[install]
nodejs.pkg-path = "nodejs_20"
python3.pkg-path = "python3"
jq.pkg-path = "jq"

[vars]
NODE_ENV = "development"

[hook]
on-activate = '''
export NODE_CACHE="$FLOX_ENV_CACHE/node"
export npm_config_cache="$NODE_CACHE/npm-cache"
mkdir -p "$NODE_CACHE"

# From devbox.json shell.init_hook
if [ -f package.json ]; then
  npm install
fi
'''

[options]
systems = ["x86_64-linux", "aarch64-linux", "aarch64-darwin"]
