schema-version = "1.10.0"
# Generated by /floxify — Tier-3 stretch fixture (AI-431)

# Conversion mode: Brewfile → Flox manifest. `brew "<name>"` lines map to
# Flox catalog packages:
#   brew "jq"      → jq
#   brew "ripgrep" → ripgrep
#   brew "git-lfs" → git-lfs
#   brew "awscli"  → awscli2   (Homebrew ships awscli v2; the catalog's
#                    v2 pkg-path is awscli2)
# `tap` lines are Homebrew plumbing with no Flox equivalent and are
# dropped. Per the skill, the Brewfile is left in place (Homebrew is
# system-wide; Flox handles project deps). Pure CLI tooling — no runtime,
# no hook needed.
#
# Catalog claims live-verified via `flox show` on 2026-07-21 (nixpkgs):
#   jq, ripgrep, git-lfs, awscli2 — all resolve on the three declared
#   systems.

[install]
jq.pkg-path = "jq"
ripgrep.pkg-path = "ripgrep"
git-lfs.pkg-path = "git-lfs"
awscli2.pkg-path = "awscli2"

[options]
systems = ["x86_64-linux", "aarch64-linux", "aarch64-darwin"]
