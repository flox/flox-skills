schema-version = "1.10.0"
# Generated by /floxify

# Node.js 20 environment.
# Seeded from flox/javascript-node; adapted from .nvmrc + engines.node in package.json.

[install]
nodejs.pkg-path = "nodejs_20"
nodejs.pkg-group = "javascript-node"

[vars]
NODE_ENV = "development"

[hook]
on-activate = '''
export NODE_CACHE="$FLOX_ENV_CACHE/node"
mkdir -p "$NODE_CACHE"
export npm_config_cache="$NODE_CACHE/npm-cache"

if [ -f package.json ] && [ -f package-lock.json ]; then
  HASH=$(cat package.json package-lock.json | sha256sum | cut -d" " -f1)
  LAST=$(cat "$NODE_CACHE/packages-hash" 2>/dev/null)
  if [ "$HASH" != "$LAST" ]; then
    npm install
    echo "$HASH" > "$NODE_CACHE/packages-hash"
  fi
fi
'''
