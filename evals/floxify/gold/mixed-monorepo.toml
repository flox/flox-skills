schema-version = "1.10.0"
# Generated by /floxify — Tier-3 stretch fixture (AI-431)

# Polyglot monorepo: three services, three runtimes, no single top-level
# package manager. Exercises floxify Phase-1 multi-ecosystem detection:
#   - services/web    → Node 20 (.nvmrc + engines.node), pnpm
#   - services/api    → Python 3.12 (requires-python), uv (uv.lock)
#   - services/worker → Go 1.22 (go.mod)
# All three toolchains must be present at once. Runtimes share the
# default (toplevel) pkg-group so they co-resolve on one catalog page;
# per-service caches live under $FLOX_ENV_CACHE.
#
# Catalog claims live-verified via `flox show` on 2026-07-21 (nixpkgs):
#   nodejs_20, pnpm, python3, uv, go — all resolve on the three declared
#   systems and co-resolve together (`flox list -c`).

[install]
nodejs.pkg-path = "nodejs_20"
pnpm.pkg-path = "pnpm"
python3.pkg-path = "python3"
uv.pkg-path = "uv"
go.pkg-path = "go"

[vars]
NODE_ENV = "development"

[hook]
on-activate = '''
# Node (services/web) — pnpm store under the env cache
export NODE_CACHE="$FLOX_ENV_CACHE/node"
export npm_config_cache="$NODE_CACHE/npm-cache"
export PNPM_HOME="$NODE_CACHE/pnpm"
mkdir -p "$NODE_CACHE" "$PNPM_HOME"

# Python (services/api) — uv venv + cache under the env cache
export UV_CACHE_DIR="$FLOX_ENV_CACHE/uv-cache"
export UV_PROJECT_ENVIRONMENT="$FLOX_ENV_CACHE/uv-venv"
mkdir -p "$UV_CACHE_DIR"

# Go (services/worker) — module cache and GOPATH under the env cache
export GOPATH="$FLOX_ENV_CACHE/go"
export GOCACHE="$FLOX_ENV_CACHE/go/cache"
export GOMODCACHE="$FLOX_ENV_CACHE/go/pkg/mod"
mkdir -p "$GOPATH" "$GOCACHE" "$GOMODCACHE"
'''

[profile]
bash = '''
export PNPM_HOME="$FLOX_ENV_CACHE/node/pnpm"
export GOPATH="$FLOX_ENV_CACHE/go"
export PATH="$PNPM_HOME:$GOPATH/bin:$PATH"
'''
zsh = '''
export PNPM_HOME="$FLOX_ENV_CACHE/node/pnpm"
export GOPATH="$FLOX_ENV_CACHE/go"
export PATH="$PNPM_HOME:$GOPATH/bin:$PATH"
'''

[options]
systems = ["x86_64-linux", "aarch64-linux", "aarch64-darwin"]
