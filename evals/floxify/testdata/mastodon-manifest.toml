# Representative capture of the manifest /floxify produced for the mastodon
# fixture (repo mastodon/mastodon @ 52e9ec7814fc). Used by test_tier2.py as a
# regex-drift guard: if a future edit to tier2.jsonl's runtime patterns or a
# refactor of the structural-conformance checks stops matching real skill
# output, the guard test fails. The install/vars sections are the actual
# produced output; the [services.*] blocks reproduce the sections whose
# presence the live run's passing has_service_* hard-checks confirmed (the
# JSON results file only stores a 3000-char excerpt that truncates before
# them). Not a byte-exact archive — a faithful representation for the guard.
schema-version = "1.13.0"
# Generated by /floxify

## Install Packages --------------------------------------------------
[install]
# Language runtimes (pinned — same on every machine)
ruby.pkg-path = "ruby_4_0"          # .ruby-version 4.0.6 · Gemfile.lock · Dockerfile RUBY_VERSION
nodejs.pkg-path = "nodejs_24"       # .nvmrc 24.18 · package.json engines.node >=22 · Dockerfile NODE_MAJOR_VERSION

# Databases (local dev — root docker-compose.yml is production-only)
postgresql_14.pkg-path = "postgresql_14"  # docker-compose.yml + devcontainer postgres:14 · pg gem
redis.pkg-path = "redis"                  # docker-compose.yml + devcontainer redis:7 · redis / hiredis-client gems

# Native library deps for Ruby C-extension gems
vips.pkg-path = "vips"
ffmpeg.pkg-path = "ffmpeg"

[vars]
RAILS_ENV = "development"
PGHOST = "127.0.0.1"
PGPORT = "5432"
PGUSER = "postgres"
PGDATABASE = "mastodon_development"
REDIS_HOST = "127.0.0.1"
REDIS_PORT = "6379"

[hook]
on-activate = """
  export GEM_HOME="$FLOX_ENV_CACHE/gems"
  export BUNDLE_PATH="$GEM_HOME"
  export PATH="$GEM_HOME/bin:$PATH"
  mkdir -p "$GEM_HOME"
"""

[services.postgres]
command = "postgres -D $FLOX_ENV_CACHE/postgres -k /tmp"

[services.redis]
command = "redis-server --dir $FLOX_ENV_CACHE/redis"
