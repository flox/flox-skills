schema-version = "1.13.0"
# Golden reference for posthog @ 55525a19f353

# PostHog is a python(uv) + node(pnpm monorepo) app. Postgres and Redis are
# dev-time services -- a developer needs them running locally to develop
# against -- so they're wired as native Flox services, self-initializing,
# no Docker required. ClickHouse (plus the Kafka/ZooKeeper it depends_on) is
# runtime-oriented analytics infrastructure with bespoke server config and
# service coupling a bare catalog package can't reproduce; it's deferred
# WITH A MECHANISM to PostHog's own configured docker-compose stack (see
# [hook]), never silently dropped. See posthog-notes.md's "Service
# disposition" table (AI-470) for the full per-service reasoning.

[install]
# Pkg-group economy (AI-478, 2026-07-17): re-tested the AI-457 5-way
# isolation empirically against the live catalog per the escalation
# ladder (SKILL.md "Pkg-group economy"). Step 1 -- pin the toolchain,
# unpin the libraries -- collapsed FOUR of the five: python313 keeps its
# exact pin (the one genuinely repo-demanded constraint: `requires-python
# = "==3.13.13"`, a hard equality, not a floor); nodejs_24, corepack_24,
# and postgresql_15 dropped their exact `version` (matched docker-compose
# patches, not repo-required) and now co-resolve with python313 in the
# shared toplevel group -- confirmed live via `flox edit -f` + `flox
# activate -c "echo __ok__"`: resolved to nodejs_24@24.16.0,
# corepack_24@24.16.0, postgresql_15@15.18 (same major line each pkg-path
# already guarantees). Redis is the one holdout: `flox activate` confirmed
# a catalog page carrying python313@python3-3.13.13 has ONLY redis 8.x,
# not 7.x -- unpinning it resolves, but silently jumps the major version
# away from what docker-compose (redis:7.2-alpine) and this golden are
# verified against, an unacceptable behavior change disguised as an
# economy win. Isolating redis alone (LAST rung, seam-justified: it has
# no native-linkage coupling to python/node/postgres) is the most
# economical shape that actually resolves -- 5 single-package groups down
# to 1. Caveat per the escalation ladder's step-1 report rule: nodejs_24,
# corepack_24, and postgresql_15 are no longer pinned to the exact
# patches docker-compose runs (24.13.0/24.13.0/15.12) -- they float
# within their major line. Full attempt log, failure evidence, and
# resolved versions in posthog-notes.md's "Pkg-group economy (AI-478)"
# section.

# Python 3.13.13 — pyproject.toml `requires-python = "==3.13.13"`. The
# catalog's version string carries a "python3-" prefix (confirmed via
# `flox show python313`) -- pin the exact string it prints, not the bare
# semver a human would write, or the pin does not resolve at all. Kept
# exact: this is the toolchain step 1 of the escalation ladder pins,
# because it's the one hard repo-demanded equality constraint here.
python3.pkg-path = "python313"
python3.version = "python3-3.13.13"

# Node 24 — .nvmrc `v24.13.0`; package.json engines.node ">=24 <25".
# Version unpinned (AI-478): the exact patch matched .nvmrc, not a hard
# requirement -- package.json's own engines range only floors at >=24,
# and the pkg-path already confines resolution to the 24.x line. Floats
# with python313 in the shared toplevel group; resolved live to
# nodejs_24@24.16.0 on 2026-07-17 (see posthog-notes.md).
nodejs.pkg-path = "nodejs_24"

# uv — uv.lock present; pyproject.toml has [tool.uv] (the Python package manager)
uv.pkg-path = "uv"

# corepack — installed explicitly rather than relying on nodejs_24's
# bundled copy, so the pinned `packageManager` below resolves via a
# known, verified corepack rather than whatever happens to ship inside
# the nodejs derivation. Lower priority (4 < the manifest default of 5,
# see options.priority docs) so corepack_24's own binary wins any PATH
# collision with nodejs_24's bundled one. Idiom confirmed live in
# PostHog's own upstream .flox/env/manifest.toml, adopted here (AI-470 —
# see posthog-notes.md's upstream-adoption table). Version unpinned
# (AI-478): nothing requires corepack's OWN version to match anything
# exactly -- its job (provisioning the exact pnpm@10.29.3 pin) doesn't
# depend on it. Resolved live to corepack_24@24.16.0 on 2026-07-17.
corepack.pkg-path = "corepack_24"
corepack.priority = 4

# PostgreSQL 15 server+client — docker-compose.base.yml `db` = postgres:15.12-alpine
# Provides initdb/postgres/createdb/pg_isready for [services.postgres].
# Version unpinned (AI-478): the exact patch matched compose's image, not
# a hard repo requirement -- the pkg-path already confines resolution to
# the 15.x line. Resolved live to postgresql_15@15.18 on 2026-07-17.
postgresql.pkg-path = "postgresql_15"
postgresql.outputs = ["out", "lib", "dev"]  # default is out+man only; exposes libpq/pg_config even though psycopg[binary] ships its own (see notes: "supplies libpq/pg_config as a bonus")

# Redis 7.2 server — docker-compose.base.yml `redis7` = redis:7.2-alpine
# Provides redis-server for [services.redis]. Isolated (last rung, AI-478,
# 2026-07-17): `flox activate` confirmed no catalog page carrying
# python313@python3-3.13.13 also carries redis 7.x -- only 8.x. Unpinning
# to co-resolve would silently jump the major version away from what this
# golden is verified against; kept exact and isolated instead. No native-
# linkage coupling to anything else in this manifest (Redis's Python
# client ships prebuilt wheels), so isolation here forfeits nothing beyond
# its own catalog page download. See posthog-notes.md for the failure
# evidence.
redis.pkg-path = "redis"
redis.version = "7.2.7"
redis.pkg-group = "redis-72"

# docker-compose — brings up ClickHouse (and its kafka/zookeeper deps) from
# PostHog's pre-configured image. ClickHouse mounts config.xml/users-dev.xml/
# user_defined_function.xml + init scripts (docker/clickhouse/) that a plain
# catalog package can't supply. See [hook].
docker-compose.pkg-path = "docker-compose"

[vars]
# Dev-only credentials mirror docker-compose.base.yml (posthog/posthog/posthog).
PGUSER = "posthog"
PGDATABASE = "posthog"
PGPASSWORD = "posthog"
PGHOST = "/tmp"
PGPORT = "5432"
REDIS_PORT = "6379"
# NOTE: UV_PROJECT_ENVIRONMENT is intentionally NOT set here — [vars] values are
# literal strings (a "$FLOX_ENV_CACHE/venv" here would not expand). It is
# exported with expansion in [hook] on-activate and [profile] common instead.

[hook]
on-activate = '''
  # --- Python: uv-managed venv under $FLOX_ENV_CACHE (never ./venv) ---
  export UV_PROJECT_ENVIRONMENT="$FLOX_ENV_CACHE/venv"
  uv sync --frozen || uv sync

  # --- Node: corepack_24 (installed above) activates the pinned pnpm@10.29.3
  #     into a writable cache dir (the Nix nodejs store path is read-only). ---
  export COREPACK_HOME="$FLOX_ENV_CACHE/corepack"
  mkdir -p "$FLOX_ENV_CACHE/node-bin"
  corepack enable --install-directory "$FLOX_ENV_CACHE/node-bin" pnpm
  export PATH="$FLOX_ENV_CACHE/node-bin:$PATH"
  pnpm install --frozen-lockfile

  # --- ClickHouse: deferred-with-mechanism (AI-470 service disposition) to
  #     PostHog's own configured compose service (pulls kafka + zookeeper
  #     via depends_on), only when a Docker daemon is reachable. COMPOSE_FILE
  #     (not an inline `-f <file>`) keeps this the bare `docker-compose up`
  #     invocation the harness's manifest-wired-compose check recognizes. ---
  if command -v docker >/dev/null 2>&1 && docker info >/dev/null 2>&1; then
    export COMPOSE_FILE="docker-compose.dev.yml"
    docker-compose up -d clickhouse
  else
    echo "[flox] Docker not reachable — ClickHouse not started." >&2
    echo "[flox] Run: COMPOSE_FILE=docker-compose.dev.yml docker-compose up -d clickhouse" >&2
  fi
'''

[profile]
common = '''
  # Re-activate the uv venv and expose the pnpm shim on every shell entry.
  export UV_PROJECT_ENVIRONMENT="$FLOX_ENV_CACHE/venv"
  [ -f "$FLOX_ENV_CACHE/venv/bin/activate" ] && \
    source "$FLOX_ENV_CACHE/venv/bin/activate"
  export PATH="$FLOX_ENV_CACHE/node-bin:$PATH"
'''

[services.postgres]
# Data under $FLOX_ENV_CACHE, socket in /tmp, trust auth (dev only).
command = '''
  export PGDATA="$FLOX_ENV_CACHE/postgres"
  if [ ! -d "$PGDATA" ]; then
    initdb -D "$PGDATA" -U "$PGUSER" --auth=trust >/dev/null
  fi
  postgres -D "$PGDATA" -k /tmp -c listen_addresses=127.0.0.1 -p "$PGPORT" &
  pg_pid=$!
  until pg_isready -h /tmp -p "$PGPORT" -U "$PGUSER" >/dev/null 2>&1; do
    sleep 0.5
  done
  createdb -h /tmp -p "$PGPORT" -U "$PGUSER" "$PGDATABASE" 2>/dev/null || true
  wait "$pg_pid"
'''

[services.redis]
# Data under $FLOX_ENV_CACHE, socket in /tmp; mirrors compose maxmemory config.
command = '''
  mkdir -p "$FLOX_ENV_CACHE/redis"
  exec redis-server \
    --port "$REDIS_PORT" \
    --unixsocket /tmp/posthog-redis.sock \
    --maxmemory 200mb \
    --maxmemory-policy allkeys-lru \
    --dir "$FLOX_ENV_CACHE/redis"
'''

[options]
# x86_64-darwin excluded: at latest (unpinned), uv and docker-compose
# (confirmed live via `flox show`) both lack an x86_64-darwin build. uv
# installs every Python dependency and docker-compose brings up ClickHouse
# (a hard dependency per the header comment above), so the env can't
# activate on Intel macOS regardless. python313@python3-3.13.13 itself DOES
# have an x86_64-darwin build -- it is uv/docker-compose that block this
# platform, not the interpreter. See posthog-notes.md.
systems = ["x86_64-linux", "aarch64-linux", "aarch64-darwin"]
