schema-version = "1.13.0"

# Image `withpkg`: everything in `base`, plus the flox-ai launcher and the
# PUBLISHED skills-flox package — so the Flox package delivery cells exercise
# the exact artifact a consumer installs, not a working copy.

[install]
claude-code.pkg-path = "flox/claude-code"
codex.pkg-path = "flox/codex"
opencode.pkg-path = "flox/opencode"
nodejs.pkg-path = "nodejs"
git.pkg-path = "git"
jq.pkg-path = "jq"
flox-ai.pkg-path = "flox/flox-ai"
# PINNED, and it does not follow the catalog on its own. `--rebuild` re-runs
# `flox containerize` against this lock and produces a byte-identical image, so
# a new published `skills-flox` means editing this line and re-locking
# (`flox edit -d environments/withpkg -f <manifest>`) — otherwise the three
# flox-ai cells keep exercising the superseded artifact while the README says
# they exercise the one a consumer installs. Check with
# `flox show flox/skills-flox`; tests/test_environments.py pins that this
# version and the lock's agree.
skills-flox.pkg-path = "flox/skills-flox"
skills-flox.version = "1.1.0"

[options]
systems = ["x86_64-linux"]
